services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: allinfit-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: allinfit-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: allinfit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allinfit-api
    depends_on:
      - sqlserver
      - redis
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=AllInFit;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;MultipleActiveResultSets=True
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMQ: amqp://guest:guest@rabbitmq:5672
      Cache__Enabled: "true"
      EventBus__Enabled: "true"
      Hangfire__Enabled: "true"
      RateLimiting__Enabled: "true"
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: allinfit-nginx
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  sqlserver-data: